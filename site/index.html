<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Criz Stephan Evangelista</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
      <div class="nav-container">
        <a class="nav-logo" href="#home">Steeeph<span>yyyy</span></a>

        <!-- CSS-only mobile menu toggle (no JavaScript needed) -->
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu" />
        <label for="nav-toggle" class="nav-burger" aria-hidden="true">
          <span></span><span></span><span></span>
        </label>

        <nav class="nav-links">
          <a href="#home">Home</a>
          <a href="#works">About</a>
          <a href="#contact">Contact</a>
        </nav>

        <button class="nav-btn" type="button">Peekaaboo</button>
      </div>
    </header>

    <main>
      <!-- ============ SECTION 1: Title + Character ============ -->
      <section class="hero" id="home">
        <div class="hero__inner">
          <div class="hero__title">
            <h1 class="hero__first">Criz Stephan</h1>
            <h2 class="hero__last">Evangelista</h2>
          </div>
        </div>

        <div class="hero__character">
          <img
            src="images/kaneki.png"
            alt="Manga-style character smoking a cigarette"
            width="1375"
            height="1400"
          />
        </div>
      </section>

      <!-- ============ SECTION 2: Character traits marquee ============ -->
      <section class="works" id="works">
        <h2 class="works__title">Character Traits</h2>

        <div class="works__viewport">
          <ul class="works__track">
            <li class="panel">
              <div class="panel__img"><img src="images/criz1.jpg" alt="Observant" /></div>
              <p class="panel__caption">Observant</p>
            </li>
            <li class="panel">
              <div class="panel__img"><img src="images/criz2.jpg" alt="Kind" /></div>
              <p class="panel__caption">Kind</p>
            </li>
            <li class="panel">
              <div class="panel__img"><img src="images/criz3.jpg" alt="Enthusiastic" /></div>
              <p class="panel__caption">Enthusiastic</p>
            </li>
            <li class="panel">
              <div class="panel__img"><img src="images/criz4.jpg" alt="Worthy" /></div>
              <p class="panel__caption">Worthy</p>
            </li>
            <li class="panel">
              <div class="panel__img"><img src="images/criz5.jpg" alt="Deprived" /></div>
              <p class="panel__caption">Deprived</p>
            </li>
            <li class="panel">
              <div class="panel__img"><img src="images/criz6.jpg" alt="Intelligent" /></div>
              <p class="panel__caption">Intelligent</p>
            </li>

            <!-- Duplicate set for a seamless infinite loop (hidden from screen readers) -->
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz1.jpg" alt="" /></div>
              <p class="panel__caption">Observant</p>
            </li>
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz2.jpg" alt="" /></div>
              <p class="panel__caption">Kind</p>
            </li>
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz3.jpg" alt="" /></div>
              <p class="panel__caption">Enthusiastic</p>
            </li>
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz4.jpg" alt="" /></div>
              <p class="panel__caption">Worthy</p>
            </li>
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz5.jpg" alt="" /></div>
              <p class="panel__caption">Deprived</p>
            </li>
            <li class="panel" aria-hidden="true">
              <div class="panel__img"><img src="images/criz6.jpg" alt="" /></div>
              <p class="panel__caption">Intelligent</p>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
